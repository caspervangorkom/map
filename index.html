<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coldcase Explorer</title></head><body><script>
(async function(){
  var source='https://raw.githubusercontent.com/caspervangorkom/map/8ca569796d0f91a51f7859fdb428298845a8c989/index.html';
  try{
    var r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('Bronpagina kon niet worden geladen ('+r.status+').');
    var html=await r.text();
    var old=String.raw`var listCases=(Array.isArray(cases)?cases:[]).filter(function(c){
      var wanted=c&&(c.link||c.url||'')||'';
      if(!wanted || /\/zaak-zonder-dossier(?:$|\?)/i.test(wanted))return false;
      var meta=caseMetaFor(c);
      if(!meta)return false;
      var key=popupUrlKey(meta.link||wanted);`;
    var replacement=String.raw`var listCases=(Array.isArray(cases)?cases:[]).filter(function(c){
      var wanted=c&&(c.link||c.url||'')||'';
      if(!wanted || /\/zaak-zonder-dossier(?:$|\?)/i.test(wanted))return false;
      var key=popupUrlKey(wanted);`;
    if(html.indexOf(old)===-1)throw new Error('De lijstcode kon niet veilig worden aangepast.');
    html=html.replace(old,replacement);

    var mapOld=String.raw`renderAllCases(cases); cases.forEach(function(c){`;
    var mapReplacement=String.raw`cases=cases.filter(function(c){var u=String(c&&(c.link||c.url||'')||'').trim().toLowerCase();return u!=='https://www.coldcasezaken.nl/ongeidentificeerde-doden/jane-doe-namen';}); renderAllCases(cases); cases.forEach(function(c){`;
    if(html.indexOf(mapOld)===-1)throw new Error('De kaartcode kon niet veilig worden aangepast.');
    html=html.replace(mapOld,mapReplacement);

    var yearOld=String.raw`+(year?'<div class="cc-leaflet-year">'+esc(year)+'</div>':'')`;
    var yearReplacement=String.raw`+(year && String(year).trim()!=='0'?'<div class="cc-leaflet-year">'+esc(year)+'</div>':'')`;
    if(html.indexOf(yearOld)===-1)throw new Error('De jaarweergave kon niet veilig worden aangepast.');
    html=html.replace(yearOld,yearReplacement);

    document.open();document.write(html);document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;color:#224576;padding:30px;max-width:700px;margin:auto"><h2>Coldcase Explorer tijdelijk niet beschikbaar</h2><p>'+String(e.message||e)+'</p></div>';
  }
})();
</script></body></html>
