<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coldcase Kaart — Beheer</title>
<style>
:root{font-family:Arial,sans-serif;color:#1f2937;background:#f5f7fa}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.top h1{margin:0;font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap}button{border:0;border-radius:7px;padding:10px 14px;font-weight:700;cursor:pointer;background:#163b5c;color:#fff}button.secondary{background:#e5e7eb;color:#1f2937}.notice{background:#fff;border-left:4px solid #163b5c;padding:12px 14px;margin-bottom:18px;border-radius:6px}.bar{display:flex;gap:10px;margin-bottom:14px}.bar input{flex:1}.count{padding:10px 0;color:#6b7280}input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:6px;font-size:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.panel{background:#fff;border-radius:8px;padding:18px;box-shadow:0 1px 4px #00000012}.case{border:1px solid #e5e7eb;border-radius:7px;padding:12px;margin-bottom:9px}.case strong{display:block;margin-bottom:5px}.case small{color:#6b7280}.case .row{display:flex;justify-content:space-between;gap:8px;align-items:center}.case button{padding:7px 10px;font-size:13px}.empty{color:#6b7280;padding:20px 0;text-align:center}.field{margin-bottom:12px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.form-actions{display:flex;gap:8px;margin-top:16px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<div class="wrap"><div class="top"><h1>Coldcase Kaart — Beheer</h1><div class="actions"><button onclick="newCase()">+ Nieuwe zaak</button><button class="secondary" onclick="downloadJson()">JSON opslaan</button></div></div>
<div class="notice"><strong>Veilige testversie.</strong> Deze pagina verandert niets aan GitHub. Je kunt zaken beheren en daarna een nieuwe <code>cases.json</code> downloaden. De bestaande kaart blijft hierdoor volledig ongemoeid.</div>
<div class="bar"><input id="search" placeholder="Zoek op zaaknaam of link…" oninput="renderList()"></div>
<div class="grid"><section class="panel"><div class="count" id="count"></div><div id="list"></div></section><section class="panel"><h2 id="formTitle">Nieuwe zaak</h2><div class="field"><label>Titel</label><input id="title"></div><div class="field"><label>Link naar dossier</label><input id="link" type="url"></div><div class="field"><label>Latitude</label><input id="lat" type="number" step="any"></div><div class="field"><label>Longitude</label><input id="lng" type="number" step="any"></div><div class="form-actions"><button onclick="saveCase()">Opslaan</button><button class="secondary" onclick="clearForm()">Annuleren</button></div></section></div></div>
<script>
let cases=[],editing=-1;const $=id=>document.getElementById(id);
async function init(){try{const r=await fetch('cases.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);cases=await r.json();renderList()}catch(e){$('list').innerHTML='<div class="empty">cases.json kon niet worden geladen. Open deze pagina via dezelfde website als de kaart.</div>';console.error(e)}}
function renderList(){const q=$('search').value.toLowerCase();const f=cases.map((c,i)=>({c,i})).filter(x=>(x.c.title||'').toLowerCase().includes(q)||(x.c.link||'').toLowerCase().includes(q));$('count').textContent=cases.length+' zaken'+(q?' — '+f.length+' gevonden':'');$('list').innerHTML=f.length?f.map(({c,i})=>`<div class="case"><div class="row"><div><strong>${esc(c.title||'Zonder titel')}</strong><small>${c.lat}, ${c.lng}</small></div><button onclick="editCase(${i})">Bewerken</button></div></div>`).join(''):'<div class="empty">Geen zaken gevonden.</div>'}
function editCase(i){editing=i;const c=cases[i];$('formTitle').textContent='Zaak bewerken';$('title').value=c.title||'';$('link').value=c.link||'';$('lat').value=c.lat??'';$('lng').value=c.lng??'';window.scrollTo({top:0,behavior:'smooth'})}
function newCase(){$('formTitle').textContent='Nieuwe zaak';clearForm();$('title').focus()}
function clearForm(){['title','link','lat','lng'].forEach(id=>$(id).value='');editing=-1;$('formTitle').textContent='Nieuwe zaak'}
function saveCase(){const title=$('title').value.trim(),link=$('link').value.trim(),lat=Number($('lat').value),lng=Number($('lng').value);if(!title||!link||!Number.isFinite(lat)||!Number.isFinite(lng)){alert('Vul titel, link, latitude en longitude correct in.');return}const item={lat,lng,title,link};if(editing<0)cases.push(item);else cases[editing]=item;renderList();clearForm()}
function downloadJson(){const blob=new Blob([JSON.stringify(cases,null,2)+'\n'],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cases.json';a.click();URL.revokeObjectURL(a.href)}
function esc(s){return String(s).replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]))}init();
</script></body></html>
