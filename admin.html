  if(!Array.isArray(cases))return false;
  var seen=new Set(),out=[],changed=false;
  for(var i=cases.length-1;i>=0;i--){
    var c=cases[i]||{};
    var key=String(c.title||'').trim().toLowerCase()+'\\n'+String(c.link||c.url||'').trim().toLowerCase();
    if(key==='\\n'){out.unshift(c);continue}
    if(seen.has(key)){changed=true;continue}
    seen.add(key);out.unshift(c);
  }

  return changed;
}
