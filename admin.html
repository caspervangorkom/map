    var r=await fetch(source,{cache:'no-store'});

function dedupeCases(){
  if(!Array.isArray(cases))return false;
  var seen=new Set(),out=[],changed=false;
  for(var i=cases.length-1;i>=0;i--){
    var c=cases[i]||{};
    var key=String(c.title||'').trim().toLowerCase()+'\\n'+String(c.link||c.url||'').trim().toLowerCase();
    if(key==='\\n'){out.unshift(c);continue}
    if(seen.has(key)){changed=true;continue}
    seen.add(key);out.unshift(c);
  }
  if(changed){cases=out;editing=-1;renderList();}
  return changed;
}
function normalizeTipLinks(){
  if(!Array.isArray(cases))return false;
  var changed=false;
  cases.forEach(function(c){
    if(!c)return;
    var link=String(c.link||c.url||'').trim().toLowerCase();
    if(link===GENERIC_URL){c.link=TIP_URL;delete c.url;changed=true;}
  });
  if(changed){editing=-1;renderList();}
  return changed;
}
function removeLegacyPeppi(){
  if(!Array.isArray(cases))return false;
  var legacy='https://www.coldcasezaken.nl/ongeidentificeerde-doden/jane-doe-namen';
  var before=cases.length;
  cases=cases.filter(function(c){return String(c&&(c.link||c.url||'')||'').trim().toLowerCase()!==legacy;});
  if(cases.length!==before){editing=-1;renderList();return true;}
  return false;
}
var originalSaveCase=saveCase;
saveCase=function(){
  var linkField=$('link');
  if(linkField&&!linkField.value.trim())linkField.value=TIP_URL;
  originalSaveCase();
  dedupeCases();
};

  var topNew=document.querySelector('button[onclick="newCase()"]');

  else{

    if(linkInput&&linkInput.parentElement){
      var label=linkInput.parentElement.querySelector('label');
      if(label)label.textContent='Link naar dossier of tipformulier';
    }
  }
}
async function cleanupDuplicateCases(){
  var normalized=normalizeTipLinks();
  var removedLegacy=removeLegacyPeppi();
  var removedDuplicates=dedupeCases();
  if(!normalized&&!removedLegacy&&!removedDuplicates)return;
  var status=document.getElementById('githubStatus');
  if(status)status.textContent='Opschonen…';
  try{
    var r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({cases:cases})});

  }catch(e){
    if(status)status.innerHTML='<span class="dangertext">Opruimen mislukt: '+esc(e.message)+'</span>';
  }
}
init().then(function(){makeCmsButtonsClearer();return cleanupDuplicateCases();});`;
