<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coldcase Kaart — Beheer</title>
</head>
<body>
<script>
(async function(){
  var source='https://raw.githubusercontent.com/caspervangorkom/map/fdb67c702291e3482bf4d607d787b1bd0e016918/admin.html';
  var tip='https://www.coldcasezaken.nl/meld-informatie-anoniem';
  try{
    var r=await fetch(source,{cache:'no-store'});
    if(!r.ok)throw new Error('Originele beheerpagina kon niet worden geladen ('+r.status+').');
    var html=await r.text();
    html=html.replace('<label>Link naar dossier</label><input id="link" type="url" autocomplete="off">','<label>Link naar dossier of tipformulier</label><input id="link" type="url" autocomplete="off" value="'+tip+'">');
    var extra='<script>\nsetTimeout(function(){\n  var tipUrl='+JSON.stringify(tip)+';\n  var field=document.getElementById("link");\n  if(field&&!field.value.trim()){field.value=tipUrl;field.setAttribute("value",tipUrl);}\n  if(typeof window.newCase==="function"){\n    var originalNewCase=window.newCase;\n    window.newCase=function(){originalNewCase();var f=document.getElementById("link");if(f){f.value=tipUrl;f.setAttribute("value",tipUrl);}};\n  }\n  if(typeof window.saveCase==="function"){\n    var originalSaveCase=window.saveCase;\n    window.saveCase=function(){var f=document.getElementById("link");if(f&&!f.value.trim())f.value=tipUrl;originalSaveCase();};\n  }\n  var label=document.querySelector("label[for=\\"link\\"]")||document.getElementById("link")?.parentElement?.querySelector("label");\n  if(label)label.textContent="Link naar dossier of tipformulier";\n},500);\n<\\/script>';
    html=html.replace('</body>',extra+'</body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div style="font-family:Arial,sans-serif;color:#224576;padding:30px;max-width:700px;margin:auto"><h2>Coldcase CMS tijdelijk niet beschikbaar</h2><p>'+String(e.message||e)+'</p></div>';
  }
})();
</script>
</body>
</html>
